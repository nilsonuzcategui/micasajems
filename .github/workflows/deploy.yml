# .github/workflows/deploy.yml

name: Build and Deploy to Custom Server (FTP)

on:
    # Dispara el workflow en cada push a la rama 'main'
    push:
        branches: ["main"]

    # Permite la ejecución manual
    workflow_dispatch:

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # 1. Configurar Node.js (v20 recomendado para Astro)
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            # 2. Instalar dependencias
            - name: Install Dependencies
              run: npm ci

            # 3. Construir el proyecto Astro
            # Esto genera los archivos finales en la carpeta 'dist'
            - name: Build Astro Project
              env:
                  # URL del API externo de actividades (otro proyecto).
                  PUBLIC_ACTIVIDADES_API: ${{ secrets.PUBLIC_ACTIVIDADES_API }}
              run: npm run build

            # 4. Subir el frontend Astro vía FTP
            - name: Deploy Astro Frontend via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.0
              with:
                  server: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: 21
                  local-dir: ./dist/
                  server-dir: /
                  state-name: .ftp-deploy-state-frontend
                  log-level: verbose
                  exclude: |
                      .git*
                      .git*/**
                      .cache/**
